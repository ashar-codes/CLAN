// CLAN Share-to-CLAN intake (Android): receives SEND / SEND_MULTIPLE intents. Compiled in the Android build.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.shareintake'
version = '0.1.0'

android {
  defaultConfig { versionCode 1; versionName '0.1.0' }
  namespace "expo.modules.shareintake"
}
