// CLAN pinned transport (Android). Compiled in the Android build and run on the emulator (docs/TESTING.md).
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.pinnedtransport'
version = '0.1.0'

android {
  defaultConfig { versionCode 1; versionName '0.1.0' }
  namespace "expo.modules.pinnedtransport"
}

dependencies {
  // OkHttp is already part of React Native on Android.
  implementation "com.squareup.okhttp3:okhttp:4.9.2" // the version React Native 0.86 ships
}
