<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- LAN servers have dynamic addresses/ports, so connect-src must allow http:/ws: on any host. No remote scripts. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' http: ws:" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Classroom LAN</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
