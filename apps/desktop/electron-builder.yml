appId: app.classroomlan.desktop
productName: CLAN
directories: { output: release }
# Main/preload/renderer are fully bundled by Vite; no node_modules needed at runtime.
files: [dist/**, package.json, '!**/*.map']
npmRebuild: false
beforePack: build/require-helpers.cjs
# clan://capture?url=…|text=… (validated by parseIntake; links and text only, into the Inbox)
protocols:
  - { name: CLAN, schemes: [clan] }
asar: true
# A packaged CLAN only runs its own signed code: no ELECTRON_RUN_AS_NODE / NODE_OPTIONS / --inspect (they would let any
# local process run code as CLAN, with CLAN's keychain access to the safeStorage-wrapped keys), and only the verified asar.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  enableCookieEncryption: true
mac:
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  category: public.app-category.education
  # Each package ships only its own native binaries (Windows x64 variants are installed for cross-packaging).
  # (a list of only exclusions makes electron-builder add **/*, i.e. the whole app dir — keep the includes here)
  files: [dist/**, package.json, '!**/*.map', '!**/node_modules/@napi-rs/canvas-win32-*/**', '!**/node_modules/@napi-rs/canvas-darwin-x64/**']
  target: [dmg, zip]
  extendInfo:
    NSLocalNetworkUsageDescription: CLAN finds people and CLANs on your local network. No internet is used.
    NSBonjourServices: [_classroomlan._tcp, _clansync._tcp, _clanpeer._tcp, _clanlink._tcp]
    NSCameraUsageDescription: CLAN uses the camera only when you scan a person, device or optical transfer code.
    NSMicrophoneUsageDescription: CLAN uses the microphone only while you record a voice message or join a call.
    NSBluetoothAlwaysUsageDescription: CLAN uses Bluetooth to find a nearby CLAN host when it runs its own network. Only pairing messages are exchanged.
  extraResources:
    - { from: ../../native/macos-ble/clan-ble, to: clan-ble }
    # Local SFU for screen sharing: sh native/livekit/fetch.sh (builds from source on macOS)
    - { from: "../../native/livekit/bin/darwin-${arch}/livekit-server", to: livekit-server }
win:
  target: [nsis]
  files: [dist/**, package.json, '!**/*.map', '!**/node_modules/@napi-rs/canvas-darwin-*/**', '!**/node_modules/@napi-rs/canvas-win32-arm64-msvc/**']
  # Built on Windows: dotnet publish native/windows-direct -c Release (see docs/WINDOWS_DIRECT_MODE.md)
  extraResources:
    - { from: ../../native/windows-direct/bin/publish/CLAN.DirectHelper.exe, to: CLAN.DirectHelper.exe }
    - { from: "../../native/livekit/bin/win32-${arch}/livekit-server.exe", to: livekit-server.exe }
nsis:
  include: build/installer.nsh
  # Per-machine (elevated) so the firewall rules above can be added; user data in %APPDATA% is kept on uninstall.
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
linux:
  target: [AppImage]
  extraResources:
    - { from: "../../native/livekit/bin/linux-${arch}/livekit-server", to: livekit-server }
