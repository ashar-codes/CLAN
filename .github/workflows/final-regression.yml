name: CLAN final regression (Linux + Windows)
on:
  push:
    branches: [final-clan-polish, fix/discovery-and-android-push]
    paths: ['apps/**', 'packages/**', 'native/**', 'pnpm-lock.yaml', '.github/workflows/final-regression.yml']
permissions:
  contents: read
jobs:
  software:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    # Fresh Windows profiles now wait for protected encryption-key metadata to
    # reach disk. Keep every test deadline intact; budget for those real waits.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: npm install -g pnpm@11.20.0
      - run: pnpm install --frozen-lockfile
      - name: Compile Windows native input adapter
        if: runner.os == 'Windows'
        shell: bash
        run: sh native/remote-control/build.sh
      - name: Fetch pinned local SFU
        shell: bash
        run: sh native/livekit/fetch.sh
      - run: pnpm typecheck
      - run: pnpm build:desktop
      - name: Windows recovery diagnostic
        if: runner.os == 'Windows' && !cancelled()
        working-directory: apps/desktop
        run: pnpm exec vitest run -c vitest.e2e.config.ts e2e/data.test.ts
      - run: pnpm exec vitest run --maxWorkers=1
        if: '!cancelled()'
      - name: Complete Windows Electron regression
        if: runner.os == 'Windows' && !cancelled()
        working-directory: apps/desktop
        run: pnpm exec vitest run -c vitest.e2e.config.ts
      - name: Real-network discovery matrix (native mDNS + sockets on this runner)
        if: '!cancelled()'
        shell: bash
        env:
          CLAN_DISCOVERY_MATRIX: '1'
          CLAN_DISCOVERY_RUNS: '6'
          CLAN_DISCOVERY_RESULTS: discovery-results-${{ runner.os }}.json
        run: pnpm exec vitest run packages/clan/test/discovery-matrix.test.ts --maxWorkers=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: '!cancelled()'
        with:
          name: discovery-results-${{ runner.os }}
          path: discovery-results-*.json
          if-no-files-found: warn
          retention-days: 14
