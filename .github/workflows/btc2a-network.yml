name: BTC-2A network verification
on:
  push:
    branches: [btc-2a-universal-lan]
permissions:
  contents: read
jobs:
  software:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: npm install -g pnpm@11.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build:desktop
      - run: pnpm exec vitest run packages/server/test/lan-directory.test.ts packages/clan/test/people-link.test.ts packages/clan/test/people-transport.test.ts --maxWorkers=1
      - name: Windows Electron directory, People and media regressions
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: pnpm exec vitest run -c vitest.e2e.config.ts e2e/lan-directory.test.ts e2e/people.test.ts
      - name: Actual routed TCP in disposable Linux namespaces
        if: runner.os == 'Linux'
        run: |
          bash tools/sim/lan-topology.sh routed
          bash tools/sim/lan-topology.sh bridged
