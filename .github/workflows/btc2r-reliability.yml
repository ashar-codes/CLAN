name: BTC-2R networking and background regression
on:
  push:
    branches: [btc-2r-always-reachable]
    paths: ['apps/**', 'packages/**', 'native/**', 'pnpm-lock.yaml', '.github/workflows/btc2r-reliability.yml']
permissions:
  contents: read
jobs:
  software:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: npm install -g pnpm@11.20.0
      - run: pnpm install --frozen-lockfile
      - name: Compile Windows native input adapter
        if: runner.os == 'Windows'
        shell: bash
        run: sh native/remote-control/build.sh
      - name: Fetch pinned local SFU
        shell: bash
        run: sh native/livekit/fetch.sh
      - run: pnpm typecheck
      - run: pnpm build:desktop
      - name: Windows recovery diagnostic
        if: runner.os == 'Windows' && !cancelled()
        working-directory: apps/desktop
        run: pnpm exec vitest run -c vitest.e2e.config.ts e2e/data.test.ts
      - run: pnpm exec vitest run --maxWorkers=1
        if: '!cancelled()'
      - name: Complete Windows Electron regression
        if: runner.os == 'Windows' && !cancelled()
        working-directory: apps/desktop
        run: pnpm exec vitest run -c vitest.e2e.config.ts
